# Sert l'export statique de Next.js (out/). Les routes /api/ et /_reveil sont prises par le proxy d'entrée.
#
# En-têtes de sécurité repris de templates/nginx.conf (core-platform), adaptés : CSP sans
# localhost:8501/:9000 (injoignables d'ici) et sans script-src/style-src externe (rien n'en a
# besoin pour l'instant) — ajouter dans connect-src ce qu'un futur appel externe exigerait.
server {
  listen 80;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

  # Chaque route du export Next a déjà son .html pré-rendu : pas de repli de type SPA vers
  # index.html ici (ça masquerait les vraies 404 pour une app multi-pages).
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  # Contrôles de santé : fichiers statiques public/health et public/sante.
  location ~ ^/(health|sante)$ {
    default_type text/plain;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
